name: Build and Deploy
on:
  # This workflow runs on pushes to main, and can also be triggered manually
  # (the `workflow_dispatch` event). To run it on other events, uncomment some
  # of the lines below.

  # # Runs on pull requests
  # pull_request:
  #     branches: ["*"]

  # Runs on pushes to main.  If a push to main does not start a run, GitHub is
  # not creating an Actions check suite for the push (visible via the API as
  # `commits/{sha}/check-suites` returning only a Pages suite).  This repository
  # arrived as an import, which leaves that auto-triggering suppressed.  Neither
  # editing this file nor disabling/enabling the workflow clears it; turning
  # Actions off and back on for the whole repository does:
  #   gh api --method PUT repos/OWNER/REPO/actions/permissions -F enabled=false
  #   gh api --method PUT repos/OWNER/REPO/actions/permissions -F enabled=true -f allowed_actions=all
  push:
      branches: ["main"]
      # Claude Code's settings do not affect the built book, so a push that
      # touches nothing else should not spend ~4 minutes rebuilding and
      # republishing the site.  A push that changes these files alongside
      # anything else still builds, as paths-ignore only skips a push whose
      # every changed file matches.  Use `workflow_dispatch` to force a build.
      paths-ignore:
        - '.claude/**'

  # # Runs every day at 00:00 UTC
  # schedule:
  #     - cron: '0 0 * * *'

  # Runs on demand
  workflow_dispatch:

# Only one deploy at a time. Every run ends by force-pushing gh-pages, so
# several in flight at once race to publish and the last to *finish* wins --
# which is not necessarily the newest commit. A burst of pushes once stacked
# ten concurrent builds this way. Grouping them means a new push cancels the
# older run instead of competing with it, so what goes live is always the
# most recent commit.
#
# The group is keyed by ref, so a manual workflow_dispatch on main shares it
# with pushes to main (as it should, since they publish the same site), while
# a run on any other ref would queue separately.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Same image as .devcontainer/devcontainer.json, so a local build and a CI
    # build use the same pretext, prefigure, latex and sagemath.
    container: pretextbook/pretext-full:1.9

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: add gh-cli
        run: |
          apt-get update
          apt-get install gh jq -y

      - name: setup git config
        run: |
          git config --global --add safe.directory $(pwd)
          git config user.name "${{ github.actor }} via GitHub Actions"
          git config user.email "${{ github.actor }}@github_actions.no_reply"

      - name: install deps
        run: pip install -r requirements.txt --break-system-packages

      - name: initialize prefigure
        run: prefig init

      - name: install local ptx files
        run: pretext --version

      # Builds the web target and the print target, and drops the PDF next to
      # the HTML pages so the navbar's "PDF" button resolves. `pretext deploy`
      # then copies output/web wholesale to the staging area.
      #
      # extra_mem_top/bot: this book's PDF holds hundreds of tikz pictures
      # (every workspace box, plus the pgfplots surfaces), whose paths are
      # token lists in TeX's main memory. At xelatex's default ceiling
      # (main_memory=5000000) the print run dies mid-book with "TeX capacity
      # exceeded" and ships a truncated PDF (page-count guard in
      # scripts/build-site.sh catches it). Kpathsea reads these two values
      # from the environment at runtime, no format rebuild needed:
      # extra_mem_top extends the token/char region, extra_mem_bot the
      # box/glue region.
      - name: build site (web + PDF)
        run: scripts/build-site.sh
        env:
          extra_mem_top: "50000000"
          extra_mem_bot: "20000000"

      - name: run deploy
        run: pretext deploy --no-push

      - name: push gh-pages branch
        run: git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
