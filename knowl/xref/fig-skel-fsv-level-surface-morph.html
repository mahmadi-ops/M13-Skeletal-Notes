<div class="para" id="interactive-skel-level-surface-morph-1-1">The surface shown is the level surface <span class="process-math">\(g(x,y,z) = x^2+y^2-z^2 = c\text{.}\)</span> Drag the <span class="process-math">\(c\)</span> slider, or press “Play” to sweep <span class="process-math">\(c\)</span> from <span class="process-math">\(-4\)</span> to <span class="process-math">\(4\)</span> and back. Every horizontal slice is a circle of radius <span class="process-math">\(\sqrt{c+z^2}\text{:}\)</span> for <span class="process-math">\(c \gt 0\)</span> that radius is defined for every <span class="process-math">\(z\text{,}\)</span> so the surface is a single sheet pinched to a waist of radius <span class="process-math">\(\sqrt c\)</span> in the <span class="process-math">\(xy\)</span>-plane; for <span class="process-math">\(c \lt 0\)</span> it needs <span class="process-math">\(|z| \ge \sqrt{-c}\text{,}\)</span> so the surface breaks into two bowls with a gap between them; and at <span class="process-math">\(c = 0\)</span> the waist and the gap both shrink to the single point where the two nappes of the cone meet. The buttons jump straight to the three cases. “Cone ghost” keeps the <span class="process-math">\(c = 0\)</span> cone on screen faintly, so you can watch both hyperboloids hug it as <span class="process-math">\(|c|\)</span> gets small. Drag the figure to change the viewpoint, or press “Spin” to let it turn.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-skel-level-surface-morph-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>

</div></details>
